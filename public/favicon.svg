<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Nascente">
  <title>Nascente</title>
  <!-- Meia rodela de cítrico, com a casca separada da polpa por um vão.
       Substituiu, em 2026-08-11, uma rodela com casca, albedo, quatro gomos
       irregulares e veios de 0,9px. Em 16px, o tamanho real de uma aba,
       aquilo virava uma mancha laranja.

       O vão escuro entre casca e polpa é o detalhe que faz a leitura
       acontecer: sem ele, sobra meio círculo laranja. Com ele, lê como
       cítrico sem precisar de veio nenhum.

       O fundo precisa ser exatamente a cor de tinta da paleta (#191210),
       porque o vão e os cortes são recortes que mostram o fundo. Trocar a
       cor do `rect` sem trocar a dos recortes quebra o desenho.

       ATENÇÃO ao editar este comentário: comentário XML não pode conter dois
       hifens seguidos. Escrever o nome de uma variável CSS aqui invalida o
       arquivo inteiro, o navegador não faz o parse, e o ícone simplesmente
       não aparece. Foi o que aconteceu na primeira versão deste arquivo. -->
  <rect width="64" height="64" fill="#191210"/>
  <path d="M5 45A27 27 0 0 1 59 45Z" fill="#c99a58"/>
  <path d="M12 45A20 20 0 0 1 52 45Z" fill="#191210"/>
  <path d="M17 45A15 15 0 0 1 47 45Z" fill="#c99a58"/>
  <g stroke="#191210" stroke-width="4.2" stroke-linecap="round">
    <path d="M32 45V31"/>
    <path d="M32 45 21.5 34.5"/>
    <path d="M32 45 42.5 34.5"/>
  </g>
</svg>
